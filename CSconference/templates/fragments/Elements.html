	<!-- 써머노트 -->
	<head th:fragment="fragment-summernoteheader">
		<link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.css" rel="stylesheet">
		<script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote-lite.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/summernote-image-attributes@1.0.0/dist/summernote-image-attributes.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/summernote-video-plugin@1.0.0/summernote-video-plugin.min.js"></script>
	</head>
	<head th:fragment="fragment-summernoteContent(noteId)">
		<script>
		 /*<![CDATA[*/
			var noteId = '[[${noteId}]]';
		/*]]>*/	
			jQuery(document).ready(function() {
				jQuery("#"+noteId).summernote({
					height: 400,
					focus : false,
					placeholder : '내용을 입력해 주세요.',
					dialogsInBody: true,
					fontNames: ['나눔고딕','맑은 고딕','궁서','굴림체','굴림','돋음체','바탕체','Arial', 'Arial Black', 'Comic Sans MS', 'Courier New'],
					toolbar: [
						['fontname', ['fontname']],
						['fontsize', ['fontsize']],
						['style', ['bold', 'underline','strikethrough']],
						['color', ['forecolor','color']],
						['table', ['table']],
						['para', ['ul', 'ol', 'paragraph']],
						['height', ['height']],
						['view', ['codeview']],
						['link', ['linkDialogShow', 'unlink']],
						['insert', ['video']]
						],
					popover: {
						image: [
								['image', ['resizeFull', 'resizeHalf', 'resizeQuarter', 'resizeNone']],
								['float', ['floatLeft', 'floatRight', 'floatNone']],
								['remove', ['removeMedia']]
							],
						link: [
							['link', ['linkDialogShow', 'unlink']]
							],
						table: [
							['add', ['addRowDown', 'addRowUp', 'addColLeft', 'addColRight']],
							['delete', ['deleteRow', 'deleteCol', 'deleteTable']],
						],
						air: [
							['color', ['color']],
							['font', ['bold', 'underline', 'clear']],
							['para', ['ul', 'paragraph']],
							['table', ['table']],
							['insert', ['link', 'picture']]
						]
					}
					,callbacks: {
						onImageUpload: function(files, editor, welEditable) {
							 var imgs = PMSCommon.onReturnFileUpload(files,this);
							 
							 for(let i = 0; i < files.length; i++) {
							 	let fileId = imgs[i].fileId;
							 	let imgData = $("<img>").attr("src","/_conference/file/fileView?fileId="+fileId).css({
							 			//"width": "100%",
							 			//"height": "auto"
									});;
							 	$('#summernote').summernote("insertNode", imgData[0]);
							 	
							 }	 
						}
					}
				});
				jQuery("#"+noteId).summernote('foreColor', 'black');
				jQuery("#"+noteId).summernote('focus')
			});
		</script>
	</head>
</html>
