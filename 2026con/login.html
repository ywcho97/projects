<script src="/_conference/js/2026/axis-auth.js"></script>
<script th:inline="javascript">
/** User 로그인 API (Redoc: /api/user/login) — 베이스는 conference.axis.api-base-url */
var AXIS_PUBLIC_API_BASE = /*[[${axisApiBaseUrl}]]*/ "https://api.axis2026.eventconference.in";

function normalizePhone(value) {
	return (value || "").replace(/[^0-9]/g, "");
}

function parseApiError(data) {
	if (typeof AxisAuth !== "undefined" && AxisAuth.parseApiDetail) {
		return AxisAuth.parseApiDetail(data);
	}
	if (!data) {
		return "로그인에 실패했습니다.";
	}
	if (typeof data.detail === "string") {
		return data.detail;
	}
	if (Array.isArray(data.detail) && data.detail.length > 0) {
		return data.detail.map((item) => item.msg).join("\n");
	}
	return "로그인에 실패했습니다.";
}

document.getElementById("loginSubmitBtn").addEventListener("click", async function () {
	const name = document.getElementById("loginName").value.trim();
	const mobile = normalizePhone(document.getElementById("loginMobile").value);
	const warningEl = document.querySelector(".subCont.login .warning");
	
	warningEl.textContent = "";
	warningEl.classList.remove("show");

	if (!name || !mobile) {
		warningEl.textContent = "이름과 연락처를 입력해 주세요.";
		warningEl.classList.add("show");
		return;
	}
	
	this.disabled = true;
	try {
		const result = await AxisAuth.login(AXIS_PUBLIC_API_BASE, { name, mobile });
		if (!result.ok) {
			warningEl.textContent = result.message || "로그인에 실패했습니다.";
			warningEl.classList.add("show");
			return;
		}
		location.href = "./mypage";
	} catch (e) {
		warningEl.textContent = "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.";
		warningEl.classList.add("show");
	} finally {
		this.disabled = false;
	}
});
</script>
